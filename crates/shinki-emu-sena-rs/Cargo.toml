[package]
name = "shinki-emu-sena-rs"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version = "1.98"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
diagnostic-bridge = ["shinki-emu-abi/diagnostic-bridge"]

[dependencies]
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }
pal-vm.workspace = true
pal-asset.workspace = true
anyhow.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true
log.workspace = true

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }
